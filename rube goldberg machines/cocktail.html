<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f8f3e9">
    <title>Random Cocktail</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Georgia, "Times New Roman", serif;
        color: #28261f;
        background: #f8f3e9;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 2rem 1.25rem;
        background:
          radial-gradient(ellipse at 15% 10%, #f1d8b4 0, transparent 38%),
          radial-gradient(ellipse at 90% 85%, #d8e5d1 0, transparent 35%),
          #f8f3e9;
      }

      main {
        width: min(100%, 620px);
        text-align: center;
      }

      .eyebrow {
        margin: 0 0 0.75rem;
        color: #a34c32;
        font: 700 0.75rem/1.4 system-ui, sans-serif;
        letter-spacing: 0.2em;
        text-transform: uppercase;
      }

      h1 {
        margin: 0;
        font-size: clamp(2.5rem, 9vw, 5rem);
        font-weight: 500;
        letter-spacing: -0.06em;
      }

      .intro {
        margin: 1rem 0 2rem;
        color: #625d52;
        font: 1rem/1.6 system-ui, sans-serif;
      }

      button {
        min-width: 170px;
        border: 0;
        border-radius: 999px;
        padding: 1rem 2.25rem;
        color: #fffaf2;
        background: #a34c32;
        box-shadow: 0 8px 18px #6e34252b;
        cursor: pointer;
        font: 800 0.95rem/1 system-ui, sans-serif;
        letter-spacing: 0.12em;
        transition: transform 160ms ease, background-color 160ms ease;
      }

      button:hover:not(:disabled) {
        transform: translateY(-2px);
        background: #873b27;
      }

      button:focus-visible {
        outline: 3px solid #28261f;
        outline-offset: 4px;
      }

      button:disabled {
        cursor: wait;
        opacity: 0.7;
      }

      #status {
        min-height: 1.5rem;
        margin: 1rem 0 0;
        color: #625d52;
        font: 0.9rem/1.5 system-ui, sans-serif;
      }

      #status.error {
        color: #a12f25;
      }

      #drink {
        margin: 2.5rem auto 0;
        text-align: left;
      }

      #drink[hidden] {
        display: none;
      }

      #drink img {
        display: block;
        width: min(100%, 360px);
        aspect-ratio: 1;
        margin: 0 auto 1.75rem;
        border-radius: 1.25rem;
        object-fit: cover;
        box-shadow: 0 14px 34px #30251b24;
      }

      #apod {
        margin-top: 2rem;
        padding-top: 1.5rem;
        border-top: 1px solid #d9d0c1;
      }

      #apod[hidden] {
        display: none;
      }

      #apod img {
        width: 100%;
        max-height: 420px;
        aspect-ratio: 16 / 10;
        object-fit: cover;
      }

      #apod h2 {
        margin: 0 0 0.5rem;
        text-align: center;
        font-size: clamp(1.5rem, 5vw, 2rem);
        font-weight: 500;
      }

      #apod-description,
      #apod-status {
        color: #625d52;
        font: 0.9rem/1.7 system-ui, sans-serif;
      }

      #apod-link {
        display: block;
        margin: 1rem auto;
        width: fit-content;
        color: #873b27;
        font: 600 0.9rem/1.5 system-ui, sans-serif;
      }

      #drink h2 {
        margin: 0 0 0.5rem;
        text-align: center;
        font-size: clamp(1.8rem, 6vw, 2.5rem);
        font-weight: 500;
      }

      .details {
        margin: 0 0 1.5rem;
        text-align: center;
        color: #746d60;
        font: 0.9rem/1.5 system-ui, sans-serif;
      }

      #drink h3 {
        margin: 1.5rem 0 0.5rem;
        color: #a34c32;
        font: 700 0.75rem/1.4 system-ui, sans-serif;
        letter-spacing: 0.15em;
        text-transform: uppercase;
      }

      #ingredients {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
        gap: 0.5rem 1.5rem;
        margin: 0;
        padding-left: 1.2rem;
        font: 0.95rem/1.5 system-ui, sans-serif;
      }

      #instructions {
        color: #49453d;
        font: 0.95rem/1.7 system-ui, sans-serif;
      }
    </style>
  </head>
  <body>
    <main>
      <p class="eyebrow">A little something to sip</p>
      <h1>What's your drink?</h1>
      <p class="intro">Let the shaker decide. Discover a random cocktail and how to make it.</p>
      <button id="start" type="button">START!</button>
      <p id="status" role="status" aria-live="polite"></p>
      <article id="drink" aria-labelledby="drink-name" hidden>
        <img id="drink-image" alt="">
        <h2 id="drink-name"></h2>
        <p class="details" id="drink-details"></p>
        <h3>Ingredients</h3>
        <ul id="ingredients"></ul>
        <h3>How to make it</h3>
        <p id="instructions"></p>
        <section id="apod" aria-labelledby="apod-title" hidden>
          <h3>NASA image of the day</h3>
          <h2 id="apod-title"></h2>
          <p class="details" id="apod-date"></p>
          <img id="apod-image" alt="" hidden>
          <a id="apod-link" target="_blank" rel="noopener noreferrer" hidden></a>
          <p id="apod-description"></p>
        </section>
      </article>
    </main>

    <script>
      const startButton = document.querySelector("#start");
      const status = document.querySelector("#status");
      const drinkCard = document.querySelector("#drink");
      const drinkImage = document.querySelector("#drink-image");
      const apodSection = document.querySelector("#apod");

      startButton.addEventListener("click", loadRandomDrink);

      async function loadRandomDrink() {
        startButton.disabled = true;
        status.classList.remove("error");
        status.textContent = "Finding your cocktail and its NASA image...";
        drinkCard.hidden = true;

        try {
          const response = await fetch(
            "https://www.thecocktaildb.com/api/json/v1/1/random.php"
          );
          if (!response.ok) {
            throw new Error(`CocktailDB returned ${response.status}`);
          }

          const data = await response.json();
          const drink = data.drinks?.[0];
          if (!drink) {
            throw new Error("CocktailDB did not return a drink.");
          }

          showDrink(drink);
          await loadApodForDrink(drink);
        } catch (error) {
          console.error("Unable to load a random cocktail:", error);
          status.classList.add("error");
          status.textContent = "Couldn't fetch a cocktail. Please try again.";
        } finally {
          startButton.disabled = false;
        }
      }

      async function loadApodForDrink(drink) {
        const modifiedDate = drink.dataModified || drink.dateModified;
        const date = typeof modifiedDate === "string"
          ? modifiedDate.match(/^\d{4}-\d{2}-\d{2}/)?.[0]
          : null;

        if (!date) {
          status.classList.add("error");
          status.textContent = "This drink has no valid modified date for a NASA image.";
          return;
        }

        try {
          const nasaDate = date.slice(2).replaceAll("-", "");
          const response = await fetch(
            `https://science.nasa.gov/wp-json/wp/v2/apod-basic/${nasaDate}`
          );
          const apod = await response.json();
          if (!response.ok) {
            throw new Error(
              apod.message || `NASA APOD returned HTTP ${response.status}`
            );
          }

          if (
            apod.date !== date ||
            typeof apod.title !== "string" ||
            typeof apod.url !== "string"
          ) {
            throw new Error(
              "NASA APOD did not return a valid entry for this date."
            );
          }

          const imageUrl = apod.hdurl || apod.url;
          if (
            apod.media_type === "image" &&
            new URL(imageUrl).pathname.includes("nasa-logo")
          ) {
            throw new Error(
              "NASA APOD returned a placeholder instead of the day's image."
            );
          }

          showApod(apod, date);
          status.textContent = "";
        } catch (error) {
          console.error("Unable to load the NASA image of the day:", error);
          status.classList.add("error");
          status.textContent = "The cocktail loaded, but its NASA image is unavailable.";
        }
      }

      function showDrink(drink) {
        document.querySelector("#drink-name").textContent = drink.strDrink;
        drinkImage.src = drink.strDrinkThumb;
        drinkImage.alt = `${drink.strDrink} cocktail`;

        const details = [drink.strCategory, drink.strAlcoholic, drink.strGlass]
          .filter(Boolean);
        document.querySelector("#drink-details").textContent = details.join(" · ");

        const ingredients = document.querySelector("#ingredients");
        ingredients.replaceChildren();
        for (let index = 1; index <= 15; index += 1) {
          const ingredient = drink[`strIngredient${index}`]?.trim();
          if (!ingredient) continue;

          const measurement = drink[`strMeasure${index}`]?.trim();
          const item = document.createElement("li");
          item.textContent = [measurement, ingredient].filter(Boolean).join(" ");
          ingredients.append(item);
        }

        document.querySelector("#instructions").textContent =
          drink.strInstructions || "No instructions are available for this drink.";
        apodSection.hidden = true;
        drinkCard.hidden = false;
      }

      function showApod(apod, date) {
        const image = document.querySelector("#apod-image");
        const link = document.querySelector("#apod-link");
        const dateLabel = new Date(`${date}T00:00:00`).toLocaleDateString(
          undefined,
          { year: "numeric", month: "long", day: "numeric" }
        );

        document.querySelector("#apod-title").textContent = apod.title;
        document.querySelector("#apod-date").textContent = dateLabel;
        document.querySelector("#apod-description").textContent =
          apod.explanation || "";

        if (apod.media_type === "image") {
          image.src = apod.hdurl || apod.url;
          image.alt = apod.title;
          image.hidden = false;
          link.hidden = true;
        } else {
          image.removeAttribute("src");
          image.hidden = true;
          link.href = apod.url;
          link.textContent = "View NASA's media for this day";
          link.hidden = false;
        }

        apodSection.hidden = false;
      }
    </script>
  </body>
</html>
